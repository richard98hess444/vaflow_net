[project]
name = "gridflow"
version = "0.1.0"
description = "Grid Flow Simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gridflow*"]
